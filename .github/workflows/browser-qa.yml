name: Browser QA (temporary)
on:
  push:
    branches:
      - feat/initial-studio-and-projects
permissions:
  contents: read
jobs:
  verify-five-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Test all five skins, PNG, MP4/WebM and JSON
        run: |
          python3 -m http.server 8123 > /tmp/chat-video-http.log 2>&1 &
          node <<'NODE'
          const {chromium} = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            fs.mkdirSync('qa-screens', {recursive:true});
            const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
            const context = await browser.newContext({viewport:{width:1440,height:900},acceptDownloads:true});
            const page = await context.newPage();
            const pageErrors=[];
            page.on('pageerror',error=>pageErrors.push(error.message));
            page.on('console',message=>{
              if(['error','warning'].includes(message.type())) console.log('Browser console:',message.type(),message.text().slice(0,350));
            });
            page.on('response',response=>{
              if(response.status()>=400)console.log('BROWSER HTTP ERROR',response.status(),response.url());
            });
            await page.goto('http://127.0.0.1:8123/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(() => typeof window.selectChatPlatform==='function' && !!document.getElementById('platformRubika'),{timeout:60000});
            await page.evaluate(async()=>{
              if(document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,3000))]);
              appSettings.soundEffects=false;
              appSettings.showTyping=false;
              messages=[
                {id:'qa1',side:'left',text:'سلام! وقت بخیر 👋',time:'10:00',delaySec:.3,replyName:'',replyText:''},
                {id:'qa2',side:'right',text:'سلام، تست کیفیت تصویر ✅',time:'10:01',delaySec:.3,replyName:'',replyText:''}
              ];
              renderMessagesListUI();showStaticFullChat();
            });
            const capabilities=await page.evaluate(async()=>({
              videoEncoder:typeof VideoEncoder,mp4Muxer:typeof Mp4Muxer,
              mediaRecorder:typeof MediaRecorder,
              h264:typeof VideoEncoder==='undefined'?null:
                (await VideoEncoder.isConfigSupported({codec:'avc1.420028',width:750,height:1334,bitrate:3500000,framerate:30})).supported
            }));
            console.log('BROWSER CODEC CAPABILITIES',JSON.stringify(capabilities));
            const names={telegram:'Telegram',bale:'Bale',eitaa:'Eitaa',whatsapp:'WhatsApp',rubika:'Rubika'};
            for(const [platform,suffix] of Object.entries(names)){
              await page.locator('#platform'+suffix).click();
              const state=await page.evaluate(()=>{
                const c=document.getElementById('chatCanvas');
                return {platform:appSettings.platform,width:c.width,height:c.height,
                  png:c.toDataURL('image/png').slice(0,35),
                  pixel:Array.from(c.getContext('2d').getImageData(c.width/2,120,1,1).data),
                  tabSelected:document.getElementById('platform'+({telegram:'Telegram',bale:'Bale',eitaa:'Eitaa',whatsapp:'WhatsApp',rubika:'Rubika'}[appSettings.platform]))?.getAttribute('aria-pressed')};
              });
              assert.equal(state.platform,platform);
              assert.equal(state.tabSelected,'true');
              assert.ok(state.width>=720&&state.height>=1000);
              assert.ok(state.png.startsWith('data:image/png;base64,'));
              await page.locator('#chatCanvas').screenshot({path:'qa-screens/'+platform+'.png'});
              console.log('PREVIEW PASS',platform,JSON.stringify(state));
              const [jsonDownload]=await Promise.all([
                page.waitForEvent('download'),
                page.locator('#downloadProject').click()
              ]);
              const filePath=await jsonDownload.path();
              const saved=JSON.parse(fs.readFileSync(filePath,'utf8'));
              assert.equal(saved.settings.platform,platform,'JSON platform persistence');
              await page.locator('#importProject').setInputFiles(filePath);
              await page.waitForFunction(p => appSettings.platform === p, platform);
              console.log('JSON ROUNDTRIP PASS',platform);
              await page.evaluate(()=>{appSettings.soundEffects=false;appSettings.showTyping=false;});
              await page.evaluate(()=>exportChatVideoMP4());
              const result=await page.evaluate(async()=>{
                const blob=await (await fetch(window.lastChatVideoObjectUrl)).blob();
                const magic=Array.from(new Uint8Array(await blob.slice(0,16).arrayBuffer()));
                const ext=await identifyVideoContainer(blob);
                return {bytes:blob.size,mime:blob.type,ext,magic,
                  filename:document.getElementById('downloadVideoLink').download,
                  resultVisible:!document.getElementById('exportResultView').classList.contains('hidden'),
                  message:document.getElementById('exportProgressStatus').textContent};
              });
              assert.ok(result.resultVisible,'export result did not show: '+result.message);
              assert.ok(result.bytes>2048,'tiny or empty output');
              assert.ok(['mp4','webm'].includes(result.ext),'unexpected format');
              assert.ok(result.filename.endsWith('.'+result.ext),'wrong extension');
              const playback=await page.evaluate(async()=>{
                const video=document.getElementById('exportedVideoPreview');
                if(video.readyState<1)await new Promise((resolve,reject)=>{
                  video.addEventListener('loadedmetadata',resolve,{once:true});
                  video.addEventListener('error',()=>reject(new Error('Video decoder rejected file')),{once:true});
                  setTimeout(()=>reject(new Error('Video metadata timeout')),6000);
                });
                return {duration:video.duration,width:video.videoWidth,height:video.videoHeight};
              });
              assert.ok(playback.duration>1.2&&playback.duration<10,'bad video duration');
              assert.equal(playback.width,750,'unexpected encoded width');
              assert.equal(playback.height,1334,'unexpected encoded height');
              console.log('EXPORT PASS',platform,JSON.stringify({...result,playback}));
              await page.evaluate(()=>closeExportModal());
            }
            // Force MediaRecorder's WebM branch to verify honest extension and playback.
            await page.evaluate(()=>{
              appSettings.soundEffects=true;
              window.__qaMuxer=window.Mp4Muxer;window.Mp4Muxer=undefined;
              window.__qaSupports=MediaRecorder.isTypeSupported;
              MediaRecorder.isTypeSupported = mime => mime.startsWith('video/webm') && window.__qaSupports.call(MediaRecorder,mime);
            });
            await page.evaluate(()=>exportChatVideoMP4());
            const fallback=await page.evaluate(async()=>{
              const blob=await(await fetch(window.lastChatVideoObjectUrl)).blob();
              const ext=await identifyVideoContainer(blob);
              const bytes=blob.size;
              const filename=document.getElementById('downloadVideoLink').download;
              const headerText=new TextDecoder('latin1').decode(await blob.arrayBuffer());
              const hasOpus=headerText.includes('A_OPUS');
              const hasVideo=headerText.includes('V_VP8')||headerText.includes('V_VP9')||headerText.includes('V_MPEG4');
              window.Mp4Muxer=window.__qaMuxer;
              MediaRecorder.isTypeSupported=window.__qaSupports;
              appSettings.soundEffects=false;
              return {ext,bytes,filename,hasOpus,hasVideo};
            });
            assert.equal(fallback.ext,'webm','Forced WebM recorded wrong format');
            assert.ok(fallback.filename.endsWith('.webm'));
            assert.ok(fallback.bytes>2048);
            assert.ok(fallback.hasOpus,'WebM sound-effects recording lacks an Opus audio track');
            assert.ok(fallback.hasVideo,'WebM is missing its video track');
            console.log('WEBM + AUDIO ENABLED PASS',JSON.stringify(fallback));
            await page.evaluate(()=>closeExportModal());

            // Narrow screen UI should still show preview and tabs.
            await page.setViewportSize({width:390,height:844});
            await page.locator('#platformRubika').click();
            const mobile=await page.evaluate(()=>({
              pageWidth:document.documentElement.scrollWidth,
              viewportWidth:innerWidth,
              canvasWidth:document.getElementById('chatCanvas').getBoundingClientRect().width
            }));
            await page.screenshot({path:'qa-screens/mobile.png',fullPage:true});
            assert.ok(mobile.pageWidth<=mobile.viewportWidth+12,'mobile horizontal overflow');
            assert.ok(mobile.canvasWidth>190);
            console.log('MOBILE PASS',JSON.stringify(mobile));
            // Fail only for unexpected script errors; CDN/font network warnings are separate.
            console.log('Browser page errors:',JSON.stringify(pageErrors));
            assert.equal(pageErrors.length,0,'browser uncaught errors');
            await browser.close();
          })().catch(err=>{console.error('QA FAILED',err);process.exit(1)});
          NODE
      - name: Firefox and WebKit cross-browser smoke
        run: |
          python3 -m http.server 8124 > /tmp/chat-video-cross-http.log 2>&1 &
          node <<'NODE'
          const {firefox,webkit} = require('playwright');
          const assert = require('node:assert/strict');
          (async ()=>{
            const exportFailures=[];
            for(const [name,engine] of [['firefox',firefox],['webkit',webkit]]) {
              console.log('BROWSER START',name);
              const browser=await engine.launch({headless:true});
              const page=await browser.newPage({viewport:{width:1200,height:800}});
              const errs=[];
              page.on('pageerror',e=>errs.push(e.message));
              await page.goto('http://127.0.0.1:8124/',{waitUntil:'domcontentloaded',timeout:40000});
              await page.waitForFunction(()=>typeof window.selectChatPlatform==='function'&&!!document.getElementById('platformRubika'),null,{timeout:35000});
              await page.evaluate(()=>{
                appSettings.soundEffects=false;
                messages=[
                  {id:'a',side:'left',text:'سلام',time:'10:00',delaySec:.3},
                  {id:'b',side:'right',text:'تست',time:'10:01',delaySec:.3}
                ];renderMessagesListUI();showStaticFullChat();
              });
              const cases=[['Telegram','telegram'],['Bale','bale'],['Eitaa','eitaa'],['WhatsApp','whatsapp'],['Rubika','rubika']];
              for(const [id,p] of cases){
                await page.locator('#platform'+id).click();
                const result=await page.evaluate(()=>({
                  platform:appSettings.platform,
                  imageOk:document.getElementById('chatCanvas').toDataURL('image/png').startsWith('data:image/png;base64,')
                }));
                assert.equal(result.platform,p);
                assert.ok(result.imageOk);
                console.log('CROSS PREVIEW PASS',name,p);
              }
              // Headless Linux WebKit crashed while attempting MediaRecorder in an
              // exploratory run; do not imply Safari video export is certified.
              if(name==='webkit') {
                console.log('WEBKIT VIDEO EXPORT UNVERIFIED (headless Linux engine crashed during exploratory recording)');
                assert.equal(errs.length,0,'WebKit preview JavaScript errors');
                await browser.close();
                continue;
              }
              await page.evaluate(()=>exportChatVideoMP4());
              const exportResult=await page.evaluate(async()=>{
                const url=window.lastChatVideoObjectUrl;
                if(!url)return {error:document.getElementById('exportProgressStatus').textContent};
                const blob=await(await fetch(url)).blob();
                return {type:await identifyVideoContainer(blob),size:blob.size};
              });
              console.log('CROSS EXPORT RESULT',name,JSON.stringify(exportResult));
              if(!(['mp4','webm'].includes(exportResult.type)&&exportResult.size>2048)){
                exportFailures.push(name+': '+JSON.stringify(exportResult));
              } else {
                console.log('CROSS EXPORT PASS',name,JSON.stringify(exportResult));
              }
              assert.equal(errs.length,0, name+' uncaught browser errors: '+errs.join('; '));
              await browser.close();
            }
            assert.deepEqual(exportFailures,[], 'Cross-browser video export gaps: '+exportFailures.join('; '));
          })().catch(e=>{console.error('CROSS QA FAILED',e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-template-previews
          path: qa-screens/
          if-no-files-found: ignore
