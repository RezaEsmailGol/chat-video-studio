name: Compile production Tailwind CSS (temporary)
on:
  push:
    branches: [feat/initial-studio-and-projects]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile utilities with pinned Tailwind CLI
        run: |
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/studio-tailwind.css
          npx --yes tailwindcss@3.4.17 -i /tmp/studio-tailwind.css -o /tmp/studio-tailwind.min.css --content ./index.html --minify
          python3 - <<'PY'
          from pathlib import Path
          css=Path('/tmp/studio-tailwind.min.css').read_text()
          print('COMPILED_CSS_LENGTH',len(css))
          print('STUDIO_CSS_START')
          for i in range(0,len(css),1600):
              print('STUDIO_CSS_CHUNK|'+css[i:i+1600])
          print('STUDIO_CSS_END')
          PY
