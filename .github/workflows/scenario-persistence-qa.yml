name: Scenario Persistence QA (temporary)
on:
  push:
    branches: [feat/initial-studio-and-projects]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test fresh, legacy, deleted, reset and custom chat persistence
        run: |
          python3 -m http.server 8128 >/tmp/studio-scenario.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const url='http://127.0.0.1:8128/';
            const awaitReady=()=>page.waitForFunction(()=>document.getElementById('projectName')&&
              document.getElementById('platformRubika')&&typeof window.persistChatListChange==='function');
            const readDB=()=>page.evaluate(async()=>new Promise((resolve,reject)=>{
              const request=indexedDB.open('chat-video-studio',1);
              request.onerror=()=>reject(request.error);
              request.onsuccess=()=>{
                const db=request.result;
                const tx=db.transaction('projects','readonly');
                const get=tx.objectStore('projects').get('autosave');
                get.onsuccess=()=>resolve(get.result||null);
                get.onerror=()=>reject(get.error);
              };
            }));
            const waitDB=(predicate,expression)=>page.waitForFunction(async expr=>{
              const req=indexedDB.open('chat-video-studio',1);
              const db=await new Promise((resolve,reject)=>{
                req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
              });
              const value=await new Promise((resolve,reject)=>{
                const request=db.transaction('projects','readonly').objectStore('projects').get('autosave');
                request.onsuccess=()=>resolve(request.result);
                request.onerror=()=>reject(request.error);
              });
              if(expr==='cleared')return value?.demoDismissed===true && value?.messages?.length===0;
              if(expr==='demo')return value?.demoDismissed===false && value?.messages?.length===10;
              if(expr==='custom')return value?.messages?.[0]?.text==='پیام تست اختصاصی';
              return false;
            },expression,{timeout:12000});
            await page.goto(url,{waitUntil:'load'});
            await awaitReady();
            const fresh=await page.evaluate(()=>({n:messages.length,first:messages[0]?.text}));
            assert.equal(fresh.n,10);
            assert.match(fresh.first,/Chat Video Studio/);
            console.log('PASS fresh visitor sees welcome chat',JSON.stringify(fresh));

            // Legacy project with no deletion marker, empty list, from prior app version.
            const base={settings:{platform:'bale',contactName:'رضا اسماعیل گل'},
              schemaVersion:1,format:'chat-video-studio',name:'Legacy blank',messages:[]};
            await page.evaluate(async obj=>new Promise((resolve,reject)=>{
              const req=indexedDB.open('chat-video-studio',1);
              req.onsuccess=()=>{
                const db=req.result, tx=db.transaction('projects','readwrite');
                tx.objectStore('projects').put(obj,'autosave');
                tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
              };req.onerror=()=>reject(req.error);
            }),base);
            await page.reload({waitUntil:'load'});await awaitReady();
            await waitDB(null,'demo');
            const migrated=await page.evaluate(()=>({n:messages.length,p:appSettings.platform}));
            assert.deepEqual(migrated,{n:10,p:'bale'});
            console.log('PASS legacy zero-message project receives demo once',JSON.stringify(migrated));

            // Clear all, immediately verify deletion marker, and reload.
            page.once('dialog',d=>d.accept());
            await page.locator('button[onclick="clearAllMessages()"]').click();
            assert.equal(await page.evaluate(()=>messages.length),0);
            await waitDB(null,'cleared');
            await page.reload({waitUntil:'load'});await awaitReady();
            assert.equal(await page.evaluate(()=>messages.length),0);
            assert.equal((await readDB()).demoDismissed,true);
            console.log('PASS deliberate clear persists through reload');

            // User can restore deliberately with the existing reset button.
            await page.locator('button[onclick="resetToDefaultScreenshotChat()"]').first().click();
            await waitDB(null,'demo');
            await page.reload({waitUntil:'load'});await awaitReady();
            assert.equal(await page.evaluate(()=>messages.length),10);
            console.log('PASS reset demo persists through reload');

            // Delete one at a time; last deletion must remain empty.
            await page.evaluate(()=>{while(messages.length)deleteMessage(0)});
            await waitDB(null,'cleared');
            await page.reload({waitUntil:'load'});await awaitReady();
            assert.equal(await page.evaluate(()=>messages.length),0);
            console.log('PASS remove last message saves empty state');

            // Custom messages are never replaced by the demo.
            await page.evaluate(()=>{
              messages.push({id:'custom',side:'right',text:'پیام تست اختصاصی',
                time:'11:00',delaySec:.5,replyName:'',replyText:''});
              renderMessagesListUI();showStaticFullChat();
              window.persistChatListChange({changed:true});
            });
            await waitDB(null,'custom');
            await page.reload({waitUntil:'load'});await awaitReady();
            assert.equal(await page.evaluate(()=>messages[0]?.text),'پیام تست اختصاصی');
            assert.equal(await page.evaluate(()=>messages.length),1);
            console.log('PASS custom chat survives reload');
            assert.deepEqual(errors,[]);
            await browser.close();
          })().catch(error=>{console.error('SCENARIO QA FAILED',error);process.exit(1)});
          NODE
