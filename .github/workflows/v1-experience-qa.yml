name: V1 Experience QA (temporary)
on:
  push:
    branches: [feat/initial-studio-and-projects]
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Run responsive and scenario UX test
        run: |
          python3 -m http.server 8151 >/tmp/chat-v1-http.log 2>&1 &
          node <<'NODE'
          const {chromium,firefox,webkit}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('fs');
          (async()=>{
            fs.mkdirSync('qa-v1',{recursive:true});
            for(const [label,engine] of [['chromium',chromium],['firefox',firefox],['webkit',webkit]]){
              const browser=await engine.launch({headless:true,args:['--no-sandbox']});
              const context=await browser.newContext({viewport:{width:1366,height:900}});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8151/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.chatStudioReady&&window.loadStudioScenario&&window.studioUndo&&
                window.checkStudioBrowserCompatibility&&document.getElementById('platformRubika'),null,{timeout:30000});
              await page.evaluate(()=>window.chatStudioReady);
              const initial=await page.evaluate(()=>({
                messages:messages.length,
                width:document.documentElement.scrollWidth,
                scenarioButtons:document.querySelectorAll('#studioScenarioPacks button').length,
                browserStatus:document.getElementById('studioBrowserStatus').textContent
              }));
              assert.equal(initial.messages,10);
              assert.equal(initial.scenarioButtons,3);
              assert.ok(initial.browserStatus.length>12);
              console.log('FRESH PASS',label,JSON.stringify(initial));
              page.once('dialog',d=>d.accept());
              await page.locator('button[onclick="loadStudioScenario(\'product\')"]').click();
              assert.equal(await page.evaluate(()=>messages.length),6);
              assert.match(await page.evaluate(()=>messages[0].text),/محصول/);
              await page.locator('#studioUndo').click();
              assert.equal(await page.evaluate(()=>messages.length),10);
              await page.locator('#studioRedo').click();
              assert.equal(await page.evaluate(()=>messages.length),6);
              // Simulate a user deleting their story and undoing it.
              page.once('dialog',d=>d.accept());
              await page.locator('button[onclick="clearAllMessages()"]').click();
              assert.equal(await page.evaluate(()=>messages.length),0);
              await page.locator('#studioUndo').click();
              assert.equal(await page.evaluate(()=>messages.length),6);
              await page.locator('#saveProject').click();
              await page.evaluate(()=>window.chatStudioReady);
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.chatStudioReady&&document.getElementById('studioUndo'),null,{timeout:30000});
              await page.evaluate(()=>window.chatStudioReady);
              assert.equal(await page.evaluate(()=>messages.length),6);
              assert.equal(await page.locator('#studioUndo').isDisabled(),true);
              console.log('SCENARIO + UNDO/REDO + RESTORE PASS',label);
              for(const [suffix,key] of [['Telegram','telegram'],['Bale','bale'],['Eitaa','eitaa'],['WhatsApp','whatsapp'],['Rubika','rubika']]){
                await page.locator('#platform'+suffix).click();
                const state=await page.evaluate(()=>({
                  platform:appSettings.platform,
                  png:document.getElementById('chatCanvas').toDataURL('image/png').startsWith('data:image/png;base64,'),
                  size:document.getElementById('chatCanvas').width+'x'+document.getElementById('chatCanvas').height
                }));
                assert.equal(state.platform,key);
                assert.equal(state.png,true);
                console.log('TEMPLATE PREVIEW PASS',label,key,state.size);
              }
              for(const width of [320,375,390,768,1280]){
                await page.setViewportSize({width,height:844});
                const dimensions=await page.evaluate(()=>({
                  scroll:document.documentElement.scrollWidth,
                  inner:window.innerWidth,
                  canvas:document.getElementById('chatCanvas').getBoundingClientRect().width,
                  buttons:document.querySelectorAll('#studioScenarioPacks button').length
                }));
                assert.ok(dimensions.scroll<=dimensions.inner+10,
                  label+' overflow '+width+': '+JSON.stringify(dimensions));
                assert.ok(dimensions.canvas>180 && dimensions.canvas<=dimensions.inner,
                  label+' canvas bad '+width+': '+JSON.stringify(dimensions));
                assert.equal(dimensions.buttons,3);
                console.log('RESPONSIVE PASS',label,width,JSON.stringify(dimensions));
              }
              if(label==='chromium'){
                await page.setViewportSize({width:1280,height:800});
                await page.locator('#platformTelegram').click();
                await page.evaluate(()=>{appSettings.soundEffects=false;appSettings.showTyping=false;
                  messages=messages.slice(0,2).map(m=>({...m,delaySec:.3}));
                  renderMessagesListUI();showStaticFullChat();});
                await page.evaluate(()=>exportChatVideoMP4());
                const exportResult=await page.evaluate(async()=>{
                  const url=window.lastChatVideoObjectUrl;
                  if(!url)return {error:document.getElementById('exportProgressStatus').textContent};
                  const blob=await(await fetch(url)).blob();
                  const video=document.getElementById('exportedVideoPreview');
                  if(video.readyState<1)await new Promise((resolve,reject)=>{
                    video.addEventListener('loadedmetadata',resolve,{once:true});
                    video.addEventListener('error',reject,{once:true});
                    setTimeout(()=>reject(new Error('video metadata timeout')),5000);
                  });
                  return {type:await identifyVideoContainer(blob),size:blob.size,
                    width:video.videoWidth,height:video.videoHeight,duration:video.duration};
                });
                assert.ok(['mp4','webm'].includes(exportResult.type),JSON.stringify(exportResult));
                assert.ok(exportResult.size>2048);
                assert.ok(exportResult.duration>1);
                assert.equal(exportResult.width,750);
                assert.equal(exportResult.height,1334);
                console.log('VIDEO EXPORT PASS',label,JSON.stringify(exportResult));
              }
              assert.deepEqual(errors,[],label+' errors '+errors.join('; '));
              await page.screenshot({path:'qa-v1/'+label+'-studio.png',fullPage:true});
              await browser.close();
            }
          })().catch(e=>{console.error('V1 QA FAILED',e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-layout-previews
          path: qa-v1/
          if-no-files-found: ignore
