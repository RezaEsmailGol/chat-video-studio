<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Chat Video Studio — استودیو ساخت ویدیوی چت</title>
<desc id="desc">Promotional cover showing a fictional chat timeline with five messenger-themed templates, video export and local projects.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071121"/><stop offset=".53" stop-color="#112747"/><stop offset="1" stop-color="#062b33"/></linearGradient>
  <linearGradient id="a" x1="0" x2="1"><stop stop-color="#24E8C1"/><stop offset=".53" stop-color="#28C7F7"/><stop offset="1" stop-color="#7D79FF"/></linearGradient>
