  <linearGradient id="chat" x1="0" x2="1"><stop stop-color="#0D9078"/><stop offset="1" stop-color="#0F615D"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="shadow" x="-25%" y="-25%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".44"/></filter>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8FC7DB" opacity=".16"/></pattern>
  <clipPath id="screen"><rect x="613" y="100" width="493" height="427" rx="23"/></clipPath>
</defs>
